<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DORA 대시보드</title>
<style>
  body { margin: 0; background: #f4f4f2; color: #222; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: #666; font-size: 14px; margin: 0 0 20px; }
  .cards, .charts { display: grid; gap: 12px; margin-bottom: 12px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .charts { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .label { color: #666; font-size: 13px; }
  .value { font-size: 28px; font-weight: bold; margin-top: 4px; }
  .chart { height: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: normal; }
</style>
</head>
<body>
<main>
  <h1>DORA 대시보드</h1>
  <p class="sub" id="sub">불러오는 중…</p>

  <div class="cards">
    <div class="box"><div class="label">Deployment Frequency</div><div class="value" id="df"></div></div>
    <div class="box"><div class="label">Lead Time for Changes (중앙값)</div><div class="value" id="lt"></div></div>
    <div class="box"><div class="label">MTTR</div><div class="value" id="mttr"></div></div>
    <div class="box"><div class="label">Change Failure Rate</div><div class="value" id="cfr"></div></div>
  </div>

  <div class="charts">
    <div class="box"><h2>일별 배포 횟수</h2><div class="chart"><canvas id="dailyChart"></canvas></div></div>
    <div class="box"><h2>배포별 Lead Time (분)</h2><div class="chart"><canvas id="leadChart"></canvas></div></div>
  </div>

  <div class="box" style="margin-bottom:12px">
    <h2>배포 내역</h2>
    <table><thead><tr><th>배포 시각</th><th>커밋</th><th>새 커밋 수</th><th>Lead Time</th></tr></thead><tbody id="deployRows"></tbody></table>
  </div>

  <div class="box">
    <h2>장애 내역 (incident 라벨 이슈)</h2>
    <table><thead><tr><th>이슈</th><th>복구까지</th></tr></thead><tbody id="incidentRows"></tbody></table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
// 시간(소수)을 '29초', '3분', '1.5시간'처럼 바꾼다
function duration(hours) {
  if (hours == null) return "—";
  if (hours * 60 < 1) return Math.round(hours * 3600) + "초";
  if (hours < 1) return Math.round(hours * 60) + "분";
  if (hours < 48) return hours.toFixed(1) + "시간";
  return (hours / 24).toFixed(1) + "일";
}

function formatTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// 수집 워크플로우가 main 브랜치에 커밋한 최신 JSON을 읽는다. (실패하면 같이 배포된 파일을 읽는다)
async function loadMetrics() {
  const urls = [
    "https://raw.githubusercontent.com/ljh3534/OSS_ljh/main/docs/data/metrics.json?t=" + Date.now(),
    "data/metrics.json",
  ];
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (e) {}
  }
  throw new Error("metrics.json을 불러오지 못했습니다");
}

async function main() {
  const m = await loadMetrics();

  document.getElementById("sub").textContent =
    `${m.repository} · 최근 ${m.days}일 · ${formatTime(m.generated_at)} 수집`;
  document.getElementById("df").textContent = `주 ${m.deployments_per_week}회`;
  document.getElementById("lt").textContent = duration(m.lead_time_hours);
  document.getElementById("mttr").textContent = duration(m.mttr_hours);
  document.getElementById("cfr").textContent = m.change_failure_rate == null ? "—" : m.change_failure_rate + "%";

  // 날짜별 배포 횟수 세기 (최근 14일)
  const days = [];
  const counts = [];
  for (let i = 13; i >= 0; i--) {
    const day = new Date(Date.now() - i * 24 * 60 * 60 * 1000);
    days.push(`${day.getMonth() + 1}/${day.getDate()}`);
    counts.push(m.deployments.filter((d) => new Date(d.time).toDateString() === day.toDateString()).length);
  }
  new Chart(document.getElementById("dailyChart"), {
    type: "bar",
    data: { labels: days, datasets: [{ label: "배포 횟수", data: counts, backgroundColor: "#2a78d6" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
  });

  const measured = m.deployments.filter((d) => d.lead_time_hours !== null);
  new Chart(document.getElementById("leadChart"), {
    type: "line",
    data: {
      labels: measured.map((d) => formatTime(d.time)),
      datasets: [{ label: "Lead Time (분)", data: measured.map((d) => +(d.lead_time_hours * 60).toFixed(1)), borderColor: "#2a78d6", backgroundColor: "#2a78d6" }],
    },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } },
  });

  document.getElementById("deployRows").innerHTML = m.deployments.slice().reverse().map((d) =>
    `<tr><td>${formatTime(d.time)}</td><td><code>${d.sha}</code></td><td>${d.commits}</td><td>${duration(d.lead_time_hours)}</td></tr>`
  ).join("");

  document.getElementById("incidentRows").innerHTML = m.incidents.length
    ? m.incidents.map((i) => `<tr><td>#${i.number} ${i.title}</td><td>${duration(i.hours_to_restore)}</td></tr>`).join("")
    : `<tr><td colspan="2">장애가 없습니다.</td></tr>`;
}

main().catch((e) => { document.getElementById("sub").textContent = e.message; });
</script>
</body>
</html>
