name: DORA Metrics

# DORA 4대 지표를 수집해 JSON 아티팩트로 저장하고, 주간 보고서를 만든다.
on:
  # 배포(Deploy 워크플로우)가 끝나면 실행
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  # Pull Request가 main에 병합되면 실행
  pull_request:
    branches: [main]
    types: [closed]
  # 매주 월요일 09:00 KST에 실행 (주간 보고서 Issue 등록)
  schedule:
    - cron: "0 0 * * 1"
  # Actions 탭에서 수동 실행
  workflow_dispatch:

permissions:
  contents: write # 결과 파일 커밋
  issues: write # 주간 보고서 Issue 등록
  deployments: read # 배포 기록 조회

concurrency:
  group: dora-metrics
  cancel-in-progress: false

jobs:
  collect:
    # PR 이벤트는 "병합된" 경우에만 실행
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DORA 지표 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_dora.py

      - name: 주간 보고서 생성
        run: |
          python scripts/render_report.py
          cat "$(ls reports/weekly/*.md | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: 스프린트 지표 분석
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sprint_metrics.py

      - name: JSON 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_number }}
          path: |
            docs/data/metrics.json
            reports/weekly/
          retention-days: 90

      - name: 주간 보고서 Issue 등록
        # 매주 월요일 자동 실행 또는 수동 실행 때만. 같은 주의 Issue가 있으면 내용만 갱신한다
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(ls reports/weekly/*.md | tail -1)
          TITLE="[Report] 주간 DORA 보고서 $(basename "$REPORT" .md)"
          NUMBER=$(gh issue list --label report --state all --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number")
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file "$REPORT"
          else
            gh issue create --title "$TITLE" --label report --body-file "$REPORT"
          fi

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data reports week03/ANALYSIS.md README.md
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore(metrics): DORA 지표 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
