name: Bug
description: 동작이 기대와 다를 때 등록합니다
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        배포된 대시보드나 수집 워크플로우가 실제로 멈춘 **운영 장애**라면 `incident` 라벨을 함께 붙여 주세요.
        이 라벨이 붙은 이슈의 생성~종료 시간이 MTTR과 Change Failure Rate 계산에 사용됩니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요?
      description: 실제 동작과 기대한 동작을 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 수집 스크립트 (collector)
        - 대시보드 (dashboard)
        - 워크플로우 (ci)
        - 문서
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 높음 — 지표 수집 또는 대시보드가 동작하지 않음
        - 보통 — 일부 값이 틀리거나 표시가 깨짐
        - 낮음 — 사소한 불편
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 워크플로우 실행 링크나 오류 메시지가 있으면 붙여 주세요.
      render: shell
