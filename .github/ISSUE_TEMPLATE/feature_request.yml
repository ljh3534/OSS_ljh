name: Feature
description: 새 기능이나 개선을 제안합니다
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경 / 해결하려는 문제
      description: 지금 무엇이 불편하거나 부족한가요?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있나요? 체크리스트로 적어 주세요.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 수집 스크립트 (collector)
        - 대시보드 (dashboard)
        - 워크플로우 (ci)
        - 문서
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: 예상 스토리 포인트
      description: 등록 후 같은 값의 `sp:` 라벨을 붙입니다.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
